name: Bug report
description: Report a reproducible problem in FeedShift.
title: "[Bug]: "
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and Android version
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove personal or sensitive information before sharing.
    validations:
      required: false
